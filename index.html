<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Team Calendar — Fall 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EBF0F2;
    --paper-line: #C7D0D4;
    --ink: #1C2A32;
    --ink-soft: #52646D;
    --panel: #FFFFFF;
    --steel: #33586A;
    --steel-dim: #6E8B98;

    --c-aero: #8A4A2E;
    --c-avionics: #E8368F;
    --c-propulsion: #5C3D85;
    --c-manufacturing: #006994;
    --c-structures: #B0272B;
    --c-simulation: #2E8368;
    --c-admin: #C99A1E;
    --c-everyone: #2A2F33;
  }

  *{ box-sizing: border-box; }

  html{ -webkit-text-size-adjust: 100%; }

  body{
    margin:0;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px) 0 0/34px 100%,
      var(--paper);
    background-attachment: fixed;
    font-family: 'Space Grotesk', sans-serif;
    color: var(--ink);
    padding: clamp(12px, 4vw, 28px) clamp(10px, 3vw, 24px) 60px;
    overflow-x: hidden;
  }

  .sheet{
    max-width: 1180px;
    margin: 0 auto;
  }

  /* ---- Title block ---- */
  .titleblock{
    background: var(--panel);
    border: 1.5px solid var(--ink);
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: stretch;
  }
  .titleblock .main{
    padding: 22px 26px;
    border-right: 1.5px solid var(--ink);
  }
  .titleblock .team{
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--steel);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .titleblock h1{
    margin: 0;
    font-size: clamp(21px, 5vw, 34px);
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .titleblock .sub{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 8px;
  }
  .titleblock .meta{
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    min-width: 180px;
  }
  .titleblock .meta div span{
    display:block;
    color: var(--ink-soft);
    font-size: 10px;
    letter-spacing: 0.06em;
  }
  .titleblock .meta div b{
    font-size: 14px;
    font-weight: 600;
  }

  /* ---- Legend ---- */
  .legend{
    background: var(--panel);
    border: 1.5px solid var(--ink);
    border-top: none;
    padding: 14px 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    align-items: center;
  }
  .legend .label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    margin-right: 4px;
  }
  .legend .chip{
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    padding: 3px 6px 3px 3px;
    border-radius: 4px;
    transition: opacity 0.15s ease, background 0.15s ease;
  }
  .legend .chip:hover{ background: var(--paper); }
  .legend .chip:focus-visible{ outline: 2px solid var(--steel); outline-offset: 1px; }
  .legend .chip.chip-off{ opacity: 0.4; }
  .legend .chip.chip-off .swatch{ background: transparent !important; }
  .legend .swatch{
    width: 12px;
    height: 12px;
    border-radius: 3px;
    display: inline-block;
    border: 1px solid rgba(0,0,0,0.15);
    transition: background 0.15s ease;
  }

  /* ---- Tabs ---- */
  .tabs{
    display: flex;
    border: 1.5px solid var(--ink);
    border-top: none;
    background: var(--paper);
  }
  .tab{
    flex: 1;
    text-align: center;
    padding: 13px 0;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
    color: var(--steel-dim);
    background: var(--paper);
    border-right: 1.5px solid var(--ink);
    user-select: none;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab:last-child{ border-right: none; }
  .tab:hover{ background: #DDE6E9; }
  .tab.active{
    background: var(--ink);
    color: #fff;
  }

  /* ---- Calendar grid ---- */
  .month{ display: none; }
  .month.active{ display: block; }

  .weekdays{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--panel);
    border-left: 1.5px solid var(--ink);
    border-right: 1.5px solid var(--ink);
  }
  .weekdays div{
    padding: 8px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    border-right: 1px solid var(--paper-line);
    border-bottom: 1.5px solid var(--ink);
  }
  .weekdays div:last-child{ border-right: none; }

  .grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border: 1.5px solid var(--ink);
    border-top: none;
    background: var(--panel);
  }
  .cell{
    min-height: 112px;
    border-right: 1px solid var(--paper-line);
    border-bottom: 1px solid var(--paper-line);
    padding: 6px 6px 8px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .grid .cell:nth-child(7n){ border-right: none; }
  .cell.blank{ background: repeating-linear-gradient(135deg, #F6F8F9, #F6F8F9 6px, #EFF3F4 6px, #EFF3F4 12px); }

  .daynum{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .daynum .dow{ display: none; }
  .cell.today .daynum{
    color: #fff;
    background: var(--steel);
    width: 20px;
    height: 20px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .event{
    font-size: 11.5px;
    line-height: 1.25;
    padding: 3px 6px 3px 7px;
    border-radius: 3px;
    color: #fff;
    font-weight: 500;
    border-left: 3px solid rgba(0,0,0,0.25);
  }
  /* multi-day events show as a spanning .banner in grid view; their
     per-day chip is only used in the narrow/agenda view below */
  .grid .event.multiday{ display: none; }

  /* reserves the vertical slot the overlaid .banner occupies, so this
     cell's own day number/events don't get drawn underneath it */
  .banner-spacer{ height: 18px; flex: 0 0 auto; }

  .banner{
    align-self: start;
    margin-top: 24px;
    height: 18px;
    display: flex;
    align-items: center;
    padding: 0 6px;
    color: #fff;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    z-index: 2;
  }
  .banner.banner-start{ border-top-left-radius: 3px; border-bottom-left-radius: 3px; margin-left: 1px; }
  .banner.banner-end{ border-top-right-radius: 3px; border-bottom-right-radius: 3px; margin-right: 1px; }

  .cat-aero{ background: var(--c-aero); }
  .cat-avionics{ background: var(--c-avionics); }
  .cat-propulsion{ background: var(--c-propulsion); }
  .cat-manufacturing{ background: var(--c-manufacturing); }
  .cat-structures{ background: var(--c-structures); }
  .cat-simulation{ background: var(--c-simulation); }
  .cat-admin{ background: var(--c-admin); color:#2B2000; }
  .cat-everyone{ background: var(--c-everyone); }

  footer{
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 18px;
  }

  @media (max-width: 900px){
    .cell{ min-height: 96px; }
    .event{ font-size: 10.5px; }
  }

  @media (max-width: 720px){
    .titleblock{ grid-template-columns: 1fr; }
    .titleblock .main{ border-right:none; border-bottom: 1.5px solid var(--ink); }
    .cell{ min-height: 84px; }
    .weekdays div{ font-size: 9px; padding: 6px 3px; }
    .tab{ font-size: 11px; padding: 10px 0; }
  }

  /* ---- Narrow / phone: switch grid to a single-column agenda list ---- */
  @media (max-width: 620px){
    .legend{ padding: 12px 14px; gap: 8px 14px; }
    .legend .chip{ font-size: 12px; }

    .weekdays{ display: none; }

    .grid{
      display: block;
      border: 1.5px solid var(--ink);
    }
    .grid .cell{
      display: none;
      min-height: 0;
      border-right: none;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      padding: 10px 12px;
      gap: 6px 10px;
    }
    .grid .cell.blank{ display: none !important; }
    .grid .cell.has-events{ display: flex; }
    .grid .cell.has-events .daynum{
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--paper);
    }
    .daynum .dow{
      display: inline;
      color: var(--steel-dim);
      font-weight: 500;
    }
    .cell.today .daynum{ padding: 2px 8px; width: auto; height: auto; border-radius: 4px; }
    .event{ font-size: 12px; padding: 4px 8px 4px 9px; }

    /* no room to draw a spanning bar in the single-column agenda view —
       fall back to a normal chip on each day of the range instead */
    .banner{ display: none; }
    .grid .event.multiday{ display: block; }
  }
</style>
</head>

const MONTHS = [
  { year:2026, month:8, name:"September" }, // month is 0-indexed
  { year:2026, month:9, name:"October" },
  { year:2026, month:10, name:"November" },

];

const WEEKDAY_LABELS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];

// Open on the current month; clamp to the first/last tab when outside the season.
function initialMonthIdx(){
  const now = new Date();
  const key = now.getFullYear()*12 + now.getMonth();
  const keys = MONTHS.map(m => m.year*12 + m.month);
  if(key <= keys[0]) return 0;
  if(key >= keys[keys.length-1]) return keys.length-1;
  return keys.indexOf(key);
}
const ACTIVE_IDX = initialMonthIdx();
let currentIdx = ACTIVE_IDX;

// Categories toggled off via the legend; persisted so the choice sticks on reload.
const HIDDEN_CATS = new Set();
try{
  JSON.parse(localStorage.getItem("hiddenCats") || "[]").forEach(c => HIDDEN_CATS.add(c));
}catch(e){}

function toggleCategory(cat){
  if(HIDDEN_CATS.has(cat)) HIDDEN_CATS.delete(cat);
  else HIDDEN_CATS.add(cat);
  try{ localStorage.setItem("hiddenCats", JSON.stringify([...HIDDEN_CATS])); }catch(e){}
  renderMonths();
  document.querySelectorAll(`.legend .chip[data-cat="${cat}"]`)
    .forEach(chip => chip.classList.toggle("chip-off", HIDDEN_CATS.has(cat)));
}

function buildLegend(){
  const el = document.getElementById("legend");
  let html = `<span class="label">CATEGORY KEY — click to show/hide</span>`;
  CATEGORIES.forEach(c=>{
    const off = HIDDEN_CATS.has(c.key) ? " chip-off" : "";
    html += `<span class="chip${off}" data-cat="${c.key}" role="button" tabindex="0"><span class="swatch cat-${c.key}"></span>${c.label}</span>`;
  });
  el.innerHTML = html;
  el.querySelectorAll(".chip").forEach(chip=>{
    chip.addEventListener("click", ()=> toggleCategory(chip.dataset.cat));
    chip.addEventListener("keydown", e=>{
      if(e.key==="Enter" || e.key===" "){ e.preventDefault(); toggleCategory(chip.dataset.cat); }
    });
  });
}

function eventsFor(year, month, day){
  const iso = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  return EVENTS.filter(e => iso >= e.date && iso <= (e.endDate || e.date) && !HIDDEN_CATS.has(e.cat));
}

function buildMonth(m, idx){
  const { year, month, name } = m;
  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date();
  const isCurrentMonth = today.getFullYear()===year && today.getMonth()===month;

  // Multi-day events (date !== endDate) render as a single spanning bar
  // across the grid instead of a chip repeated in every cell.
  const monthStart = new Date(year, month, 1);
  const monthEnd = new Date(year, month, daysInMonth);
  const banners = [];
  const bannerDays = new Set();
  EVENTS.filter(e => e.endDate && e.endDate !== e.date && !HIDDEN_CATS.has(e.cat)).forEach(e=>{
    const s = new Date(e.date+"T00:00:00");
    const en = new Date(e.endDate+"T00:00:00");
    if(en < monthStart || s > monthEnd) return;
    const clipStart = s < monthStart ? 1 : s.getDate();
    const clipEnd = en > monthEnd ? daysInMonth : en.getDate();
    for(let d=clipStart; d<=clipEnd; d++) bannerDays.add(d);
    const startCell = firstDay + (clipStart-1);
    const endCell = firstDay + (clipEnd-1);
    for(let w=Math.floor(startCell/7); w<=Math.floor(endCell/7); w++){
      const segStart = Math.max(startCell, w*7);
      const segEnd = Math.min(endCell, w*7+6);
      banners.push({
        row: w+1,
        colStart: (segStart%7)+1,
        span: segEnd-segStart+1,
        cat: e.cat,
        title: e.title,
        isStart: segStart===startCell,
        isEnd: segEnd===endCell,
      });
    }
  });

  // Every cell (including blanks) gets an explicit grid-row/grid-column.
  // This is required once .banner elements also use explicit placement —
  // CSS Grid auto-placement skips cells already explicitly claimed, which
  // would otherwise shove auto-placed day cells into the wrong week row.
  const gridPos = i => `grid-row:${Math.floor(i/7)+1}; grid-column:${(i%7)+1};`;

  let cells = "";
  for(let i=0;i<firstDay;i++){
    cells += `<div class="cell blank" style="${gridPos(i)}"></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const cellIndex = firstDay + d - 1;
    const evs = eventsFor(year, month, d);
    const isToday = isCurrentMonth && today.getDate()===d;
    const dow = new Date(year, month, d).getDay();
    const hasBanner = bannerDays.has(d);
    const spacer = hasBanner ? `<div class="banner-spacer"></div>` : "";
    let evHtml = evs.map(e=>{
      const multiday = e.endDate && e.endDate !== e.date;
      return `<div class="event cat-${e.cat}${multiday? " multiday":""}">${e.title}</div>`;
    }).join("");
    const classes = ["cell"];
    if(isToday) classes.push("today");
    if(evs.length) classes.push("has-events");
    if(hasBanner) classes.push("has-banner");
    cells += `<div class="${classes.join(" ")}" style="${gridPos(cellIndex)}"><div class="daynum"><span class="dow">${WEEKDAY_LABELS[dow]}</span>${d}</div>${spacer}${evHtml}</div>`;
  }
  const totalCells = firstDay + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let i=0;i<trailing;i++){
    cells += `<div class="cell blank" style="${gridPos(totalCells+i)}"></div>`;
  }

  const bannerHtml = banners.map(b=>
    `<div class="banner cat-${b.cat}${b.isStart? " banner-start":""}${b.isEnd? " banner-end":""}" style="grid-row:${b.row}; grid-column:${b.colStart} / span ${b.span};">${b.title}</div>`
  ).join("");

  return `
    <div class="month${idx===currentIdx? " active":""}" id="month-${idx}">
      <div class="weekdays">${WEEKDAY_LABELS.map(w=>`<div>${w}</div>`).join("")}</div>
      <div class="grid">${cells}${bannerHtml}</div>
    </div>
  `;
}

function buildTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = MONTHS.map((m,i)=>
    `<div class="tab${i===currentIdx? " active":""}" data-idx="${i}">${m.name.toUpperCase()} 2026</div>`
  ).join("");

  el.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      currentIdx = Number(tab.dataset.idx);
      document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
      document.querySelectorAll(".month").forEach(m=>m.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(`month-${currentIdx}`).classList.add("active");
    });
  });
}

function renderMonths(){
  document.getElementById("months").innerHTML = MONTHS.map(buildMonth).join("");
}

function render(){
  buildLegend();
  buildTabs();
  renderMonths();
}

render();
</script>

</body>
</html>
