<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Team Calendar — Fall 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EBF0F2;
    --paper-line: #C7D0D4;
    --ink: #1C2A32;
    --ink-soft: #52646D;
    --panel: #FFFFFF;
    --steel: #33586A;
    --steel-dim: #6E8B98;

    --c-aero: #8A4A2E;
    --c-avionics: #E8368F;
    --c-propulsion: #5C3D85;
    --c-manufacturing: #006994;
    --c-structures: #B0272B;
    --c-simulation: #2E8368;
    --c-admin: #C99A1E;
    --c-everyone: #2A2F33;
  }

  *{ box-sizing: border-box; }

  html{ -webkit-text-size-adjust: 100%; }

  body{
    margin:0;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px) 0 0/34px 100%,
      var(--paper);
    background-attachment: fixed;
    font-family: 'Space Grotesk', sans-serif;
    color: var(--ink);
    padding: clamp(12px, 4vw, 28px) clamp(10px, 3vw, 24px) 60px;
    overflow-x: hidden;
  }

  .sheet{
    max-width: 1180px;
    margin: 0 auto;
  }

  /* ---- Title block ---- */
  .titleblock{
    background: var(--panel);
    border: 1.5px solid var(--ink);
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: stretch;
  }
  .titleblock .main{
    padding: 22px 26px;
    border-right: 1.5px solid var(--ink);
  }
  .titleblock .team{
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--steel);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .titleblock h1{
    margin: 0;
    font-size: clamp(21px, 5vw, 34px);
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .titleblock .sub{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 8px;
  }
  .titleblock .meta{
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    min-width: 180px;
  }
  .titleblock .meta div span{
    display:block;
    color: var(--ink-soft);
    font-size: 10px;
    letter-spacing: 0.06em;
  }
  .titleblock .meta div b{
    font-size: 14px;
    font-weight: 600;
  }

  /* ---- Legend ---- */
  .legend{
    background: var(--panel);
    border: 1.5px solid var(--ink);
    border-top: none;
    padding: 14px 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    align-items: center;
  }
  .legend .label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    margin-right: 4px;
  }
  .legend .chip{
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 500;
  }
  .legend .swatch{
    width: 12px;
    height: 12px;
    border-radius: 3px;
    display: inline-block;
    border: 1px solid rgba(0,0,0,0.15);
  }

  /* ---- Tabs ---- */
  .tabs{
    display: flex;
    border: 1.5px solid var(--ink);
    border-top: none;
    background: var(--paper);
  }
  .tab{
    flex: 1;
    text-align: center;
    padding: 13px 0;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
    color: var(--steel-dim);
    background: var(--paper);
    border-right: 1.5px solid var(--ink);
    user-select: none;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab:last-child{ border-right: none; }
  .tab:hover{ background: #DDE6E9; }
  .tab.active{
    background: var(--ink);
    color: #fff;
  }

  /* ---- Calendar grid ---- */
  .month{ display: none; }
  .month.active{ display: block; }

  .weekdays{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--panel);
    border-left: 1.5px solid var(--ink);
    border-right: 1.5px solid var(--ink);
  }
  .weekdays div{
    padding: 8px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    border-right: 1px solid var(--paper-line);
    border-bottom: 1.5px solid var(--ink);
  }
  .weekdays div:last-child{ border-right: none; }

  .grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border: 1.5px solid var(--ink);
    border-top: none;
    background: var(--panel);
  }
  .cell{
    min-height: 112px;
    border-right: 1px solid var(--paper-line);
    border-bottom: 1px solid var(--paper-line);
    padding: 6px 6px 8px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .grid .cell:nth-child(7n){ border-right: none; }
  .cell.blank{ background: repeating-linear-gradient(135deg, #F6F8F9, #F6F8F9 6px, #EFF3F4 6px, #EFF3F4 12px); }

  .daynum{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .daynum .dow{ display: none; }
  .cell.today .daynum{
    color: #fff;
    background: var(--steel);
    width: 20px;
    height: 20px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .event{
    font-size: 11.5px;
    line-height: 1.25;
    padding: 3px 6px 3px 7px;
    border-radius: 3px;
    color: #fff;
    font-weight: 500;
    border-left: 3px solid rgba(0,0,0,0.25);
  }

  .cat-aero{ background: var(--c-aero); }
  .cat-avionics{ background: var(--c-avionics); }
  .cat-propulsion{ background: var(--c-propulsion); }
  .cat-manufacturing{ background: var(--c-manufacturing); }
  .cat-structures{ background: var(--c-structures); }
  .cat-simulation{ background: var(--c-simulation); }
  .cat-admin{ background: var(--c-admin); color:#2B2000; }
  .cat-everyone{ background: var(--c-everyone); }

  footer{
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 18px;
  }

  @media (max-width: 900px){
    .cell{ min-height: 96px; }
    .event{ font-size: 10.5px; }
  }

  @media (max-width: 720px){
    .titleblock{ grid-template-columns: 1fr; }
    .titleblock .main{ border-right:none; border-bottom: 1.5px solid var(--ink); }
    .cell{ min-height: 84px; }
    .weekdays div{ font-size: 9px; padding: 6px 3px; }
    .tab{ font-size: 11px; padding: 10px 0; }
  }

  /* ---- Narrow / phone: switch grid to a single-column agenda list ---- */
  @media (max-width: 620px){
    .legend{ padding: 12px 14px; gap: 8px 14px; }
    .legend .chip{ font-size: 12px; }

    .weekdays{ display: none; }

    .grid{
      display: block;
      border: 1.5px solid var(--ink);
    }
    .grid .cell{
      display: none;
      min-height: 0;
      border-right: none;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      padding: 10px 12px;
      gap: 6px 10px;
    }
    .grid .cell.blank{ display: none !important; }
    .grid .cell.has-events{ display: flex; }
    .grid .cell.has-events .daynum{
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--paper);
    }
    .daynum .dow{
      display: inline;
      color: var(--steel-dim);
      font-weight: 500;
    }
    .cell.today .daynum{ padding: 2px 8px; width: auto; height: auto; border-radius: 4px; }
    .event{ font-size: 12px; padding: 4px 8px 4px 9px; }
  }
</style>
</head>
<body>

<div class="sheet">

  <div class="titleblock">
    <div class="main">
      <div class="team">Design/Build/Fly</div>
      <h1>Project Calendar</h1>
      <div class="sub">Season schedule — subsystem meetings, builds, reviews &amp; deadlines</div>
    </div>
    <div class="meta">
      <div><span>PERIOD</span><b>SEP – NOV 2026</b></div>
      <div><span>REV.</span><b>B — synced from whiteboard photos</b></div>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="tabs" id="tabs"></div>

  <div id="months"></div>

</div>

<footer>Edit the EVENTS array in the page source to update dates, titles, or categories.</footer>

<script>
/* ============================================================
   EDIT ME: add/remove/change events here.
   date  -> "YYYY-MM-DD"
   cat   -> one of: aero, avionics, propulsion, manufacturing,
                    structures, simulation, admin, everyone
   title -> event text shown on the calendar
   ============================================================ */
const EVENTS = [
  // ---- September ----
  { date:"2026-09-04", cat:"everyone",      title:"Rotational Meeting!" },
  { date:"2026-09-05", cat:"manufacturing", title:"Print + Build VS & HS for SAE" },
  { date:"2026-09-05", cat:"simulation",    title:"Wing Connector — Buy List" },
  { date:"2026-09-12", cat:"manufacturing",    title:"SDS" },
  { date:"2026-09-12", cat:"aero",          title:"Drag Articles / CFD" },
  { date:"2026-09-15", cat:"everyone",      title:"Alec Bday" },
  { date:"2026-09-16", cat:"everyone",      title:"SAE Lottery" },
  { date:"2026-09-18", cat:"aero",          title:"Begin SAE XFLR5 (Airfoils)" },
  { date:"2026-09-19", cat:"avionics",      title:"Begin Summer Plane Avionics" },
  { date:"2026-09-21", cat:"structures", title:"Finish Wings (SP)" },
  { date:"2026-09-25", cat:"manufacturing", title:"Finish HT/VT (SP)" },
  { date:"2026-09-23", cat:"propulsion",    title:"Test Motor + Propeller (Summer Plane)" },
  { date:"2026-09-26", cat:"manufacturing", title:"Finish Building Wings (SP)" },
  { date:"2026-09-25", cat:"simulation",    title:"DBF Optimizer" },
  { date:"2026-09-25", cat:"aero",          title:"Summer Plane Payload Design" },
  { date:"2026-09-26", cat:"aero",          title:"DBF XFLR5" },
  { date:"2026-09-26", cat:"structures",    title:"Begin DBF CAD" },
  { date:"2026-09-28", cat:"manufacturing", title:"Resin Infusion Practice" },
  { date:"2026-09-29", cat:"avionics",      title:"Servo Installs — Summer Plane" },
  { date:"2026-09-30", cat:"aero",          title:"Prelim. Sensor Aero & Design" },

  // ---- October ----
  { date:"2026-10-03", cat:"propulsion",      title:"Test Push Motor Config." },
  { date:"2026-10-04", cat:"everyone",      title:"Test Flight" },
  { date:"2026-10-05", cat:"structures",    title:"Begin SAE CAD" },
  { date:"2026-10-07", cat:"manufacturing", title:"Fuselage Material Selection" },
  { date:"2026-10-08", cat:"structures",    title:"Trade Studies Tables" },
  { date:"2026-10-09", cat:"everyone",      title:"Sensor Manufacturing" },
  { date:"2026-10-09", cat:"aero",          title:"SAE XFLR5" },
  { date:"2026-10-09", cat:"avionics",      title:"Servo Wiring Design" },
  { date:"2026-10-10", cat:"everyone",      title:"Formal" },
  { date:"2026-10-10", cat:"structures",    title:"DBF CAD Finished" },
  { date:"2026-10-12", cat:"simulation",    title:"MATLAB Drag Article Script Finished" },
  { date:"2026-10-12", cat:"manufacturing",    title:"Door Design" },
  { date:"2026-10-13", cat:"simulation",    title:"Sensitivity Graph" },
  { date:"2026-10-14", cat:"aero",          title:"Prelim. Servo Deployment Mechanism (CAD)" },
  { date:"2026-10-15", cat:"everyone",      title:"DBF Proposal" },
  { date:"2026-10-15", cat:"manufacturing",      title:"Start SAE Plane" },
  { date:"2026-10-16", cat:"aero",      title:"SAE CFD" },
  { date:"2026-10-16", cat:"structures",    title:"SAE Pylon Design" },
  { date:"2026-10-16", cat:"aero",      title:"Begin Servo [Missile] Machining" },
  { date:"2026-10-17", cat:"structures",    title:"Test STAND" },
  { date:"2026-10-17", cat:"avionics",      title:"Slotted Flaps Design Considerations" },
  { date:"2026-10-19", cat:"structures",    title:"SAE Plane CAD — Prelim. Design Finished" },
  { date:"2026-10-20", cat:"structures",    title:"DBF CAD Rendering" },
  { date:"2026-10-22", cat:"everyone",      title:"Front Landing Gear Redesign" },
  { date:"2026-10-26", cat:"manufacturing",    title:"Container Simulator Design" },
  { date:"2026-10-29", cat:"everyone",      title:"Greek Bday" },
  { date:"2026-10-30", cat:"aero",          title:"Winglets" },
  { date:"2026-10-30", cat:"manufacturing",    title:"Start DBF Plane" },
  { date:"2026-10-31", cat:"everyone",      title:"Halloween" },
];

const CATEGORIES = [
  { key:"aero",          label:"Aero & Payload" },
  { key:"avionics",       label:"Avionics" },
  { key:"propulsion",     label:"Propulsion" },
  { key:"manufacturing",  label:"Manufacturing" },
  { key:"structures",     label:"Structures" },
  { key:"simulation",     label:"Simulation Development" },
  { key:"admin",          label:"Administrative" },
  { key:"everyone",       label:"Everyone" },
];

const MONTHS = [
  { year:2026, month:8, name:"September" }, // month is 0-indexed
  { year:2026, month:9, name:"October" },
  { year:2026, month:10, name:"November" },
];

const WEEKDAY_LABELS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];

function buildLegend(){
  const el = document.getElementById("legend");
  let html = `<span class="label">CATEGORY KEY</span>`;
  CATEGORIES.forEach(c=>{
    html += `<span class="chip"><span class="swatch cat-${c.key}"></span>${c.label}</span>`;
  });
  el.innerHTML = html;
}

function eventsFor(year, month, day){
  const iso = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  return EVENTS.filter(e => e.date === iso);
}

function buildMonth(m, idx){
  const { year, month, name } = m;
  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date();
  const isCurrentMonth = today.getFullYear()===year && today.getMonth()===month;

  let cells = "";
  for(let i=0;i<firstDay;i++){
    cells += `<div class="cell blank"></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const evs = eventsFor(year, month, d);
    const isToday = isCurrentMonth && today.getDate()===d;
    const dow = new Date(year, month, d).getDay();
    let evHtml = evs.map(e=>`<div class="event cat-${e.cat}">${e.title}</div>`).join("");
    const classes = ["cell"];
    if(isToday) classes.push("today");
    if(evs.length) classes.push("has-events");
    cells += `<div class="${classes.join(" ")}"><div class="daynum"><span class="dow">${WEEKDAY_LABELS[dow]}</span>${d}</div>${evHtml}</div>`;
  }
  const totalCells = firstDay + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let i=0;i<trailing;i++){
    cells += `<div class="cell blank"></div>`;
  }

  return `
    <div class="month${idx===0? " active":""}" id="month-${idx}">
      <div class="weekdays">${WEEKDAY_LABELS.map(w=>`<div>${w}</div>`).join("")}</div>
      <div class="grid">${cells}</div>
    </div>
  `;
}

function buildTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = MONTHS.map((m,i)=>
    `<div class="tab${i===0? " active":""}" data-idx="${i}">${m.name.toUpperCase()} 2026</div>`
  ).join("");

  el.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      const idx = tab.dataset.idx;
      document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
      document.querySelectorAll(".month").forEach(m=>m.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(`month-${idx}`).classList.add("active");
    });
  });
}

function render(){
  buildLegend();
  buildTabs();
  document.getElementById("months").innerHTML = MONTHS.map(buildMonth).join("");
}

render();
</script>

</body>
</html>
